<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a0d10" />
    <base href="/" />
    <title>Requiem</title>
    <!-- The build fills in the fingerprinted file names below, so those files can be cached for good. -->
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min#[.{fingerprint}].css" />
    <link rel="stylesheet" href="app#[.{fingerprint}].css" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Shown until the WebAssembly app has loaded; app.css hides it once the layout renders. -->
    <div class="boot-splash" aria-live="polite">
        <span class="boot-splash-title">Requiem</span>
        <span class="boot-splash-text">Waking from torpor…</span>
    </div>
    <div id="app"></div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min#[.{fingerprint}].js"></script>
    <script src="tabs#[.{fingerprint}].js"></script>
</body>

</html>
