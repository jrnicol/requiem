# Builds and tests every push and pull request. On main it also publishes the app as a container image to
# GitHub's container registry (ghcr.io/jrnicol/requiem), tagged with the commit and "latest".
# Deploying is pull-based: the AWS server (infra/aws/requiem.yaml) checks for a new "latest" every two
# minutes and swaps it in, rolling back if it fails its health check. GitHub holds no AWS credentials;
# the AWS project's guardrails don't allow GitHub's OpenID Connect sign-in. See DEPLOY.md.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tests run against DynamoDB Local, which needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Get DynamoDB Local
        run: |
          mkdir -p "$RUNNER_TEMP/dynamodb-local"
          curl -sSfL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz | tar -xz -C "$RUNNER_TEMP/dynamodb-local"
          echo "DYNAMODB_LOCAL_HOME=$RUNNER_TEMP/dynamodb-local" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Requiem.slnx --configuration Release

      - name: Sign in to GitHub's container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # The .NET SDK builds the image itself (no Dockerfile) on the official ASP.NET runtime image.
      - name: Publish container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: >
          dotnet publish src/Requiem.Web/Requiem.Web.csproj --configuration Release
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository }}
          '-p:ContainerImageTags="${{ github.sha }};latest"'
