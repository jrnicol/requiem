# Builds and tests every push and pull request; deploys main to Azure App Service.
# Azure sign-in uses OpenID Connect with the deploy identity from infra/main.bicep, so no secrets are
# stored here. Set these repository variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_WEBAPP_NAME
# Deploys are skipped until AZURE_WEBAPP_NAME is set. See DEPLOY.md.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Test
        run: dotnet test Requiem.slnx --configuration Release

      - name: Publish
        run: dotnet publish src/Requiem.Web/Requiem.Web.csproj --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write # lets the job request the OpenID Connect token Azure accepts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
