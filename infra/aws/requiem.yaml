AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Requiem on AWS (DEPLOY.md): one small EC2 instance runs the app's container with SQLite on its own
  encrypted EBS volume, behind CloudFront for HTTPS. The instance pulls new images from ghcr.io itself
  (the project's guardrails block GitHub OIDC), backs up daily with AWS Backup, patches weekly with
  Systems Manager, and logs to CloudWatch. No SSH: use Session Manager.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  CloudFrontPrefixListId:
    Type: String
    Description: >-
      The Region's com.amazonaws.global.cloudfront.origin-facing managed prefix list
      (aws ec2 describe-managed-prefix-lists). Only CloudFront may reach the instance.
    AllowedPattern: '^pl-[0-9a-f]+$'
  InstanceType:
    Type: String
    Default: t3.micro
    Description: 1 GB is enough for the app; the container is capped at 700 MB.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  Image:
    Type: String
    Default: ghcr.io/jrnicol/requiem
    Description: Public container image; the instance follows its "latest" tag.
  DataVolumeSize:
    Type: Number
    Default: 4
    MinValue: 1
    Description: GiB for the SQLite database and the app's settings file.

Resources:
  # ---------- Network ----------

  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: A VPC of its own keeps the app apart from anything else in the project.
        must: DNS hostnames stay enabled; CloudFront reaches the instance by its public DNS name.
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Public, so the instance can pull images from ghcr.io without a NAT gateway (about $32 a month).
          Inbound traffic is still limited to CloudFront by the security group.
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public' }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public' }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: The app answers plain HTTP on port 80, and only CloudFront's origin-facing addresses may connect.
        must: No SSH or other inbound rules; administer through Session Manager.
    Properties:
      GroupDescription: HTTP from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Image pulls, package updates, AWS APIs
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  # ---------- Instance ----------

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: The container's output, sent by Docker's awslogs driver.
    Properties:
      LogGroupName: !Sub '/${AWS::StackName}/app'
      RetentionInDays: 30

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Session Manager and patching (SSM core) plus writing the app's logs. Nothing else.
        must: The app container itself gets no AWS credentials (IMDSv2 hop limit 1 in the launch template).
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: write-app-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AppLogGroup.Arn}:*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: IMDSv2 only, with a hop limit of 1 so containers can't borrow the instance's credentials.
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Holds the SQLite database and the settings file (with the first-run setup code), apart from the
          root volume, so the instance can be replaced without losing data.
        must: >-
          Stays in the instance's Availability Zone. Deleting the stack snapshots it first.
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-data' }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Runs the app container. First boot installs Docker, mounts the data volume, writes the
          settings file (once), and starts the app; a timer then follows the image's latest tag.
        must: >-
          One instance only: the app migrates the SQLite database on start, and SQLite allows one writer.
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First boot only (cloud-init). Everything the app keeps lives on the data volume.
            set -euxo pipefail

            dnf install -y docker
            systemctl enable --now docker

            # The data volume attaches after launch; on Nitro it shows up as an NVMe disk named after its ID.
            vol=${DataVolume}
            disk=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${!vol/-/}
            for i in $(seq 1 120); do [ -e "$disk" ] && break; sleep 5; done
            [ -e "$disk" ]
            blkid "$disk" || mkfs.xfs "$disk"
            mkdir -p /var/lib/requiem
            echo "UUID=$(blkid -s UUID -o value "$disk") /var/lib/requiem xfs defaults,nofail 0 2" >> /etc/fstab
            mount /var/lib/requiem

            # The app runs as the .NET images' non-root "app" user (UID 1654).
            mkdir -p /var/lib/requiem/data /var/lib/requiem/config
            chown 1654:1654 /var/lib/requiem/data
            settings=/var/lib/requiem/config/requiem.env
            set +x # keep the setup code out of the boot log
            if [ ! -f "$settings" ]; then
              umask 077
              cat > "$settings" <<EOF
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
            Hosting__BehindHttpsProxy=true
            Database__Provider=Sqlite
            Database__MigrateOnStartup=true
            ConnectionStrings__Requiem=Data Source=/data/requiem.db
            Auth__SetupCode=$(openssl rand -base64 18)
            EOF
            fi
            set -x

            mkdir -p /opt/requiem
            cat > /opt/requiem/deploy.sh <<'EOF'
            #!/bin/bash
            # deploy.sh [tag]: start that image of the app; roll back if it doesn't answer /healthz.
            set -uo pipefail
            image="${Image}:${!1:-latest}"
            previous=$(docker inspect --format '{{.Image}}' requiem 2>/dev/null || true)

            start() {
              docker rm -f requiem >/dev/null 2>&1
              docker run -d --name requiem --restart unless-stopped --memory 700m \
                -p 80:8080 -v /var/lib/requiem/data:/data --env-file /var/lib/requiem/config/requiem.env \
                --log-driver awslogs --log-opt awslogs-region=${AWS::Region} \
                --log-opt awslogs-group=${LogGroupName} --log-opt awslogs-stream=app \
                "$1" >/dev/null
            }
            healthy() {
              for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1/healthz && return 0; sleep 3; done
              return 1
            }

            docker pull --quiet "$image" || exit 1
            start "$image"
            if healthy; then
              echo "Running $image"
              docker image prune -f >/dev/null
              exit 0
            fi
            echo "$image failed its health check; recent output:" >&2
            docker logs --tail 40 requiem >&2
            docker inspect --format '{{.Image}}' requiem > /opt/requiem/failed-image
            if [ -n "$previous" ]; then
              start "$previous" && healthy && echo "Rolled back to the previous image" >&2
            fi
            exit 1
            EOF

            cat > /opt/requiem/update.sh <<'EOF'
            #!/bin/bash
            # Runs every few minutes: deploy the latest image if it isn't the one running (or one that failed).
            set -uo pipefail
            docker pull --quiet "${Image}:latest" >/dev/null || exit 0
            latest=$(docker image inspect --format '{{.Id}}' "${Image}:latest")
            running=$(docker inspect --format '{{.Image}}' requiem 2>/dev/null || true)
            failed=$(cat /opt/requiem/failed-image 2>/dev/null || true)
            [ "$latest" = "$running" ] || [ "$latest" = "$failed" ] || /opt/requiem/deploy.sh latest
            EOF
            chmod 755 /opt/requiem/deploy.sh /opt/requiem/update.sh

            cat > /etc/systemd/system/requiem-update.service <<'EOF'
            [Unit]
            Description=Deploy the latest Requiem image
            After=docker.service
            Requires=docker.service
            [Service]
            Type=oneshot
            ExecStart=/opt/requiem/update.sh
            EOF
            cat > /etc/systemd/system/requiem-update.timer <<'EOF'
            [Unit]
            Description=Check for a new Requiem image every 2 minutes
            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=2min
            [Install]
            WantedBy=timers.target
            EOF
            systemctl daemon-reload

            /opt/requiem/deploy.sh latest
            systemctl enable --now requiem-update.timer
          - LogGroupName: !Ref AppLogGroup

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  PublicAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          A fixed address gives the instance a fixed public DNS name for CloudFront's origin,
          even when the instance is stopped, started or replaced.
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  # ---------- HTTPS ----------

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          HTTPS on a cloudfront.net address without a domain or certificate of our own. Pages and API
          calls pass straight through uncached with all cookies and headers; only /_framework/* (the
          browser app's static files) is cached.
        must: >-
          The default behavior stays uncached (CachingDisabled + AllViewerExceptHostHeader): API responses
          are per user. The app treats requests as HTTPS because Hosting__BehindHttpsProxy is set.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: app
            DomainName: !Sub
              - 'ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com'
              - Dashed: !Join ['-', !Split ['.', !Ref PublicAddress]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          Compress: true
        CacheBehaviors:
          - PathPattern: /_framework/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (honours the app's Cache-Control)
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ---------- Backups and patching ----------

  BackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Daily snapshots of the data volume.
        must: Kept when the stack is deleted, so backups outlive the app.
    Properties:
      BackupVaultName: !Sub '${AWS::StackName}-backups'

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores'

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${AWS::StackName}-daily'
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 9 * * ? *) # 09:00 UTC, the small hours in US time zones
            StartWindowMinutes: 60
            Lifecycle:
              DeleteAfterDays: 14

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: data-volume
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${DataVolume}'

  WeeklyPatching:
    Type: AWS::SSM::Association
    Metadata:
      com.aws.cloudformation.Context:
        why: Installs OS security updates weekly and reboots if needed; the app container restarts by itself.
    Properties:
      Name: AWS-RunPatchBaseline
      AssociationName: !Sub '${AWS::StackName}-weekly-patching'
      ScheduleExpression: cron(0 10 ? * SUN *)
      Parameters:
        Operation: [Install]
        RebootOption: [RebootIfNeeded]
      Targets:
        - Key: InstanceIds
          Values: [!Ref Instance]

Outputs:
  SiteUrl:
    Description: The app, over HTTPS.
    Value: !Sub 'https://${Distribution.DomainName}'
  InstanceId:
    Description: For Session Manager (aws ssm start-session --target ...) and Run Command.
    Value: !Ref Instance
  LogGroup:
    Description: The app's logs in CloudWatch.
    Value: !Ref AppLogGroup
  BackupVault:
    Value: !Ref BackupVault
