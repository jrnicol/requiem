AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Requiem, serverless (SERVERLESS.md): the browser app as static files in S3, the API as one Lambda behind an
  API Gateway HTTP API, data in one DynamoDB table, and CloudFront in front of both on one HTTPS address.
  Deployed by the pipeline stack's CodeBuild project (pipeline.yaml), which passes the API's code location.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the API's Lambda package (the pipeline's artifacts bucket).
  CodeKey:
    Type: String
    Description: Key of the API's Lambda package; a new key per build makes CloudFormation update the code.

Resources:
  # ---------- Data ----------

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Every item the app keeps; the layout is in SERVERLESS.md and the code in src/Requiem.Data/Dynamo.
        must: >-
          Keys and index names must match src/Requiem.Data/Dynamo (Keys, DynamoSchema). Kept when the stack is
          deleted, and point-in-time recovery stays on: this is the only copy of the data.
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true

  # ---------- API ----------

  SetupCode:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The one-time code for creating the site's first account. Generated here so nobody has to choose
          one; read it with "aws secretsmanager get-secret-value". Setup locks once an account exists.
    Properties:
      Description: Requiem first-run setup code
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${AWS::StackName}/api'
      RetentionInDays: 30

  ApiRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: The API reads and writes its table (and indexes) and its logs. Nothing else.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub '${Table.Arn}/index/*'
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ApiLogGroup.Arn}:*'

  ApiFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The ASP.NET Core API (src/Requiem.Web) unchanged, through AddAWSLambdaHosting. It seeds the catalog on a
          cold start when the seed files changed, so the first request after a deploy can take a few seconds.
        must: >-
          Hosting__ServeClient stays false: S3 serves the browser app. The handler is the assembly name, as
          Lambda's ASP.NET Core hosting expects for an app with top-level statements.
    Properties:
      Runtime: dotnet10
      Architectures: [arm64]
      Handler: Requiem.Web
      # Memory also sets CPU. Measured 2026-10-26: a cold start's first request took 0.7 s at 1 GB, 0.4 s at
      # 2 GB and 0.27 s at 3 GB; at this traffic the extra memory stays within Lambda's free allowance.
      MemorySize: 3008
      Timeout: 30
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
        LogFormat: Text
      Environment:
        Variables:
          ASPNETCORE_ENVIRONMENT: Production
          DynamoDB__TableName: !Ref Table
          DynamoDB__Region: !Ref AWS::Region
          Database__SetupOnStartup: 'true'
          Hosting__ServeClient: 'false'
          # A one-time code, useless once the first account exists; visible only to the project's admins.
          Auth__SetupCode: !Sub '{{resolve:secretsmanager:${SetupCode}:SecretString}}'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The front door for /api/*. CloudFront forwards to it, so the browser sees one origin and the
          SameSite=Strict sign-in cookie works unchanged.
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub 'integrations/${ApiIntegration}'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /healthz
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Throttling caps floods across every Lambda instance; the app's own sign-up limit only counts per
          instance.
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ---------- Browser app ----------

  SiteBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The published browser app (src/Requiem.Web.Client). Holds no data; the pipeline replaces its contents
          on every deploy. Only CloudFront can read it.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: old-builds
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  SiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AppPaths:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The browser app owns paths like /play/{id}; S3 has no such file, so any path without a file extension
          gets index.html and the app's router takes it from there.
    Properties:
      Name: !Sub '${AWS::StackName}-app-paths'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for the browser app's own paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One HTTPS address for both halves: the app from S3 (cached as each file's Cache-Control says, which the
          pipeline sets) and /api/* from API Gateway (never cached, all cookies and headers passed).
        must: >-
          The /api/* behavior stays uncached with AllViewerExceptHostHeader: responses are per user, and API
          Gateway needs its own Host header.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (honours Cache-Control)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AppPaths.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteUrl:
    Description: The app, over HTTPS.
    Value: !Sub 'https://${Distribution.DomainName}'
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
  FunctionName:
    Value: !Ref ApiFunction
  LogGroup:
    Value: !Ref ApiLogGroup
  SetupCodeSecret:
    Description: aws secretsmanager get-secret-value --secret-id <this> --query SecretString
    Value: !Ref SetupCode
